Screens:
  ExecutiveApprovalScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(rdoExecutiveDecision);
        Reset(txtApprovalConditions);
        Reset(txtRejectionReason);
        Set(gShowRateInfo, false);
        Set(gProjectInfo,
            LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID)
        );
        ClearCollect(colProjectInvoices,
            Filter(Procurement_InvoiceData,
                Not(IsBlank(gSelectedRequest.ProjectID)) &&
                ProjectID = gSelectedRequest.ProjectID
            )
        )
    Children:
      - rectHeader_3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_2:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Max Biocare Procurement - Executive Escalation & Approval"
            Width: =716
            X: =20
      - containerScroll_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
