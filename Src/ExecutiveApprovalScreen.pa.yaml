Screens:
  ExecutiveApprovalScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(rdoExecutiveDecision);
        Reset(txtApprovalConditions);
        Reset(txtRejectionReason);
        Set(gShowRateInfo, false);
        Set(gProjectInfo,
            LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID)
        );
        ClearCollect(colProjectInvoices,
            Filter(Procurement_InvoiceData,
                Not(IsBlank(gSelectedRequest.ProjectID)) &&
                ProjectID = gSelectedRequest.ProjectID
            )
        )
    Children:
      - rowHeader_EA:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblScreenTitle_2:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =60
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Max Biocare Procurement - Executive Escalation & Approval"
                  Width: =716
            - lblUserInfo_EAS_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =60
                  PaddingRight: =0
                  Size: =12
                  Text: |-
                    =If(
                        IsBlank(gCurrentUser.Role.Value),
                        gCurrentEmployee.Title,
                        gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
                    )
                  Width: =280
