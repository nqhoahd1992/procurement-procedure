                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =14
                        Text: |-
                          ="ID: " & gSelectedRequest.ID & " - " & gSelectedRequest.Title
                        Width: =Parent.Width - 160
            - rowRequestInfo_1:
