                                    Height: =24
                                    Size: =11
                                    Text: |-
                                      =If(
                                          CountRows(colProjectInvoices) = 0,
                                          Text(0, "[#,###.00]") & " " & gProjectInfo.Currency,
                                          Concat(
                                              AddColumns(
                                                  GroupBy(colProjectInvoices, Currency, GroupedInvoices),
                                                  TotalSum, Sum(GroupedInvoices, TotalAmount)
                                              ),
                                              Text(TotalSum, "[#,###.00]") & " " & Currency,
