            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblScreenTitle_EPS:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =60
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Max Biocare Procurement - Executive Payment"
                  Width: =654
            - lblUserInfo_EPS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =60
                  PaddingRight: =0
                  Size: =12
                  Text: |-
                    =If(
                        IsBlank(gCurrentUser.Role.Value),
                        gCurrentEmployee.Title,
                        gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
                    )
                  Width: =280
