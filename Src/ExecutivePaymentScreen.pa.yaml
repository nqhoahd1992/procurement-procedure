Screens:
  ExecutivePaymentScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ResetForm(formExecutivePayment);
        Set(gPendingNewAttName, "");
        Set(gSelectedRequest, LookUp(Procurement_Requests, ID = gSelectedRequest.ID))
    Children:
      - rowHeader_EPS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblScreenTitle_EPS:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =60
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Max Biocare Procurement - Executive Payment"
                  Width: =654
            - lblUserInfo_EPS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =60
                  PaddingRight: =0
                  Size: =12
                  Text: |-
                    =If(
                        IsBlank(gCurrentUser.Role.Value),
                        gCurrentEmployee.Title,
                        gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
                    )
                  Width: =280
      - conScrollable_EPS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoBlock_EPS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 250, 1)
                  FillPortions: =0
                  Height: =170
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowInfoLine1_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =34
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =24
                        PaddingRight: =1
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblInfoTitle_EPS:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =14
                              Text: |-
                                ="ID: " & gSelectedRequest.ID & " - " & gSelectedRequest.Title
                              Width: =600
                        - lblStatusBadge_EPS:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: |-
                                =Switch(gSelectedRequest.Status.Value,
                                    "Pending Manager", RGBA(146, 84, 14, 1),
                                    "Pending Executive", RGBA(175, 74, 20, 1),
                                    "Pending Procurement", RGBA(122, 108, 10, 1),
                                    "Pending Invoice", RGBA(124, 58, 173, 1),
                                    "Goods Receipt & Acceptance", RGBA(37, 92, 178, 1),
                                    "Pending Supplier Follow-up", RGBA(11, 105, 132, 1),
                                    "Pending Accounting", RGBA(158, 44, 108, 1),
                                    "Completed", RGBA(15, 110, 86, 1),
                                    "Rejected", RGBA(163, 45, 45, 1),
                                    RGBA(68, 68, 65, 1)
                                )
                              BorderThickness: =1
                              Color: |-
                                =Switch(gSelectedRequest.Status.Value,
                                    "Pending Manager", RGBA(146, 84, 14, 1),
                                    "Pending Executive", RGBA(175, 74, 20, 1),
                                    "Pending Procurement", RGBA(122, 108, 10, 1),
                                    "Pending Invoice", RGBA(124, 58, 173, 1),
                                    "Goods Receipt & Acceptance", RGBA(37, 92, 178, 1),
                                    "Pending Supplier Follow-up", RGBA(11, 105, 132, 1),
                                    "Pending Accounting", RGBA(158, 44, 108, 1),
                                    "Completed", RGBA(15, 110, 86, 1),
                                    "Rejected", RGBA(163, 45, 45, 1),
                                    RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(gSelectedRequest.Status.Value,
                                    "Pending Manager", RGBA(253, 242, 216, 1),
                                    "Pending Executive", RGBA(253, 234, 222, 1),
                                    "Pending Procurement", RGBA(247, 245, 210, 1),
                                    "Pending Invoice", RGBA(240, 228, 252, 1),
                                    "Goods Receipt & Acceptance", RGBA(223, 234, 252, 1),
                                    "Pending Supplier Follow-up", RGBA(219, 241, 249, 1),
                                    "Pending Accounting", RGBA(252, 230, 242, 1),
                                    "Completed", RGBA(222, 245, 236, 1),
                                    "Rejected", RGBA(252, 233, 233, 1),
                                    RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =10
                              Text: ="Pending Payment From Executive"
                              Width: =260
                  - rowInfoLine2_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colCategory_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =240
                            Children:
                              - lblInfoCategoryLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Category"
                                    Width: =240
                              - lblInfoCategoryValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =gSelectedRequest.Category.Value
                                    Width: =240
                        - colCost_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =240
                            Children:
                              - lblInfoCostLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Estimated Cost"
                                    Width: =240
                              - lblInfoCostValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00") & " " & gSelectedRequest.Currency
                                    Width: =240
                  - rowInfoLine4_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colProcurementType_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =300
                              X: =40
                              Y: =40
                            Children:
                              - lblInfoProcTypeLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Procurement Type"
                                    Width: =300
                              - lblInfoProcTypeValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =gSelectedRequest.ProcurementType.Value &
                                          If(
                                              IsBlank(gSelectedRequest.InvoiceType.Value),
                                              "",
                                              " · " & gSelectedRequest.InvoiceType.Value
                                          )
                                    Width: =300
                                    Wrap: =false
                        - colInvoiceDoc_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =gSelectedRequest.ProcurementType.Value = "Invoice Supplied"
                              Width: =300
                            Children:
                              - lblInfoInvoiceLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Invoice (Requester)"
                                    Width: =300
                              - lblInfoInvoiceValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(IsBlank(gSelectedRequest.RequesterInvoiceURL), RGBA(136, 135, 128, 1), RGBA(56, 96, 178, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), Launch(gSelectedRequest.RequesterInvoiceURL, {}, LaunchTarget.New))
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =If(IsBlank(gSelectedRequest.RequesterInvoiceURL), "Not uploaded", "Open invoice ↗")
                                    Tooltip: =gSelectedRequest.RequesterInvoiceURL
                                    Underline: =Not(IsBlank(gSelectedRequest.RequesterInvoiceURL))
                                    Width: =300
                                    Wrap: =false
                        - colPurchaseRequestDoc_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =gSelectedRequest.ProcurementType.Value = "To be sourced by Procurement"
                              Width: =300
                            Children:
                              - lblInfoPurchaseReqLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Purchase Request Link"
                                    Width: =300
                              - lblInfoPurchaseReqValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(IsBlank(gSelectedRequest.PurchaseRequestLink), RGBA(136, 135, 128, 1), RGBA(56, 96, 178, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =If(Not(IsBlank(gSelectedRequest.PurchaseRequestLink)), Launch(gSelectedRequest.PurchaseRequestLink, {}, LaunchTarget.New))
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =If(IsBlank(gSelectedRequest.PurchaseRequestLink), "Not provided", "Open purchase request ↗")
                                    Tooltip: =gSelectedRequest.PurchaseRequestLink
                                    Underline: =Not(IsBlank(gSelectedRequest.PurchaseRequestLink))
                                    Width: =300
                                    Wrap: =false
                        - colOfficialInvoiceDoc_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =Not(IsBlank(gSelectedRequest.OfficialInvoiceLink))
                              Width: =300
                            Children:
                              - lblInfoOfficialInvoiceLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Official Invoice (Procurement)"
                                    Width: =300
                              - lblInfoOfficialInvoiceValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(56, 96, 178, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =If(Not(IsBlank(gSelectedRequest.OfficialInvoiceLink)), Launch(gSelectedRequest.OfficialInvoiceLink, {}, LaunchTarget.New))
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Open official invoice ↗"
                                    Tooltip: =gSelectedRequest.OfficialInvoiceLink
                                    Underline: =true
                                    Width: =300
                                    Wrap: =false
            - rowUploadSection_EPS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblUploadHeader_EPS:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Upload Remittance Advice Document *"
                        Width: =Parent.Width - 40
                  - lblUploadHint_EPS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Size: =10
                        Text: ="Upload proof that this request has been paid (remittance advice / payment confirmation). Once submitted, this request will move to Pending Procurement."
                        Width: =Parent.Width - 40
                  - formExecutivePayment:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: =Procurement_Requests
                        Height: =120
                        Item: =gSelectedRequest
                        LayoutMinWidth: =100
                        NumberOfColumns: =1
                        OnFailure: =Notify("Upload failed. Please try again.", NotificationType.Error)
                        OnSuccess: |-
                          =With(
                              {wURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(gPendingNewAttName)},
                              With(
                                  {wReq: Patch(
                                      Procurement_Requests,
                                      LookUp(Procurement_Requests, ID = gSelectedRequest.ID),
                                      {
                                          Status: {Value: "Pending Procurement"},
                                          RemittanceURL: wURL
                                      }
                                  )},
                                  If(
                                      IsBlank(wReq.ID),
                                      Notify("Failed to save. Please try again.", NotificationType.Error),
                                      Notify("Remittance submitted. Request sent to Procurement.", NotificationType.Success);
                                      ProcurementNotify.Run(
                                          "procurement@maxbiocare.com",
                                          "Procurement Team",
                                          wReq.Title,
                                          wReq.ID,
                                          "ProcurementExecution",
                                          Text(wReq.RequiredDeliveryDate, "dd/mm/yyyy"),
                                          wReq.Category.Value,
                                          "Max Biocare Procurement",
                                          wReq.ID
                                      );
                                      Navigate(HomeScreen)
                                  )
                              )
                          )
                        Width: =Parent.Width - 40
                      Children:
                        - dcExecutivePayment:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicAttachmentsEdit
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =Blank()
                              DisplayMode: =DisplayMode.Edit
                              DisplayName: =""
                              Height: =100
                              Required: =false
                              Update: =attExecutivePayment.Attachments
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblAttachLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Remittance Advice Document *"
                                    Width: =Parent.Width
                              - attExecutivePayment:
                                  Control: Attachments@2.3.0
                                  Properties:
                                    Height: =100
                                    Items: =Parent.Default
                                    MaxAttachments: =100
                                    Width: =Parent.Width
      - conActionBar_EPS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_EPS:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
            - btnSubmit_EPS:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =RGBA(5, 102, 178, 1)
                  Height: =36
                  OnSelect: |-
                    =If(
                        CountRows(attExecutivePayment.Attachments) = 0,
                        Notify("Please attach the remittance advice document before submitting.", NotificationType.Error),
                        Set(gPendingNewAttName, Last(attExecutivePayment.Attachments).Name);
                        SubmitForm(formExecutivePayment)
                    )
                  Text: ="Submit Payment →"
                  Width: =200
