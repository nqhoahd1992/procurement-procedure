                  RadiusTopRight: =0
                Children:
                  - btnActionReview:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(If(gSelectedRequest.Status.Value = "Pending Manager", ManagerReviewScreen, ExecutiveApprovalScreen))
                        Text: ="Review Request →"
                        Visible: |-
                          =(gSelectedRequest.Status.Value = "Pending Manager" && (gCurrentUser.Role.Value = "Admin" || (gCurrentUser.Role.Value = "Manager" && gSelectedRequest.ManagerApproverID.Id = gCurrentEmployee.ID))) ||
                          (gSelectedRequest.Status.Value = "Pending Executive" && Not(gSelectedRequest.isExecutivePayment) && (gCurrentUser.Role.Value = "Executive" || gCurrentUser.Role.Value = "Admin"))
                        Width: =200
                        X: =40
                        Y: =40
                  - btnActionExecutivePayment:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(ExecutivePaymentScreen)
                        Text: ="Process Payment →"
                        Visible: =gSelectedRequest.Status.Value = "Pending Executive" && gSelectedRequest.isExecutivePayment && (gCurrentUser.Role.Value = "Executive" || gCurrentUser.Role.Value = "Admin")
                        Width: =200
                        X: =40
                        Y: =40
                  - btnActionStart:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(ProcurementExecutionScreen)
                        Text: ="Start Procurement →"
                        Visible: =gSelectedRequest.Status.Value = "Pending Procurement" && (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin")
                        Width: =220
                        X: =40
                        Y: =40
                  - btnActionGoodsReceipt:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(GoodsReceiptScreen)
                        Text: ="Goods Receipt & Acceptance →"
                        Visible: |-
                          =gSelectedRequest.Status.Value = "Goods Receipt & Acceptance" &&
                          (gSelectedRequest.RequesterEmail = gCurrentEmployee.Email ||
                          gSelectedRequest.GRAssignedToID.Id = gCurrentEmployee.ID)
                        Width: =260
                        X: =40
                        Y: =40
                  - btnActionSupplierFollowUpScreen:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(SupplierFollowUpScreen)
                        Text: ="Record Goods Receipt Round " & (Coalesce(gSelectedRequest.ReceiptRoundCount, 0) + 1) & " →"
                        Visible: |-
                          =gSelectedRequest.Status.Value = "Pending Supplier Follow-up" &&
                          gSelectedRequest.LatestReceiptDecision = "Requires Supplier Follow-up" &&
                          Coalesce(gSelectedRequest.ReceiptRoundCount, 0) < 2 &&
                          (gSelectedRequest.RequesterEmail = gCurrentEmployee.Email ||
                          gSelectedRequest.SFU1AssignedToID.Id = gCurrentEmployee.ID)
                        Width: =300
                        X: =40
                        Y: =40
                  - btnActionProcurementFollowUp:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(ProcurementFollowUpScreen)
                        Text: ="Upload Credit Note →"
                        Visible: |-
                          =gSelectedRequest.Status.Value = "Pending Supplier Follow-up" &&
                          gSelectedRequest.LatestReceiptDecision = "Accepted with Adjustment" &&
                          (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin")
                        Width: =260
                        X: =40
                        Y: =40
                  - btnActionAccounting:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(AccountingScreen)
                        Text: ="Start Accounting →"
                        Visible: =gSelectedRequest.Status.Value = "Pending Accounting" && (gCurrentUser.Role.Value = "Accounting" || gCurrentUser.Role.Value = "Executive" || gCurrentUser.Role.Value = "Admin")
                        Width: =220
                        X: =40
                        Y: =40
