Screens:
  RequestDetailScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp(Procurement_Requests, ID = gSelectedRequest.ID));
        ClearCollect(
            colRequirementFiles,
            ForAll(
                Filter(Split(Coalesce(gSelectedRequest.RequirementFiles, ""), "|"), Len(Value) > 0) As f,
                {
                    FileName: f.Value,
                    FileURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(f.Value)
                }
            )
        );
        ClearCollect(colExecutionLog, Filter(Procurement_ExecutionLog, RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(colReceiptRounds, Filter('Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(
            colRoundHistory,
            ForAll(
                Sort(
                    Filter('Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)),
                    RoundNumber,
                    SortOrder.Ascending
                ) As rr,
                {
                    ID: rr.ID,
                    StepNumber: 3,
                    StepLabel: "Goods receipt",
                    RoundNumber: rr.RoundNumber,
                    ActorName: rr.ReceivedBy,
                    ActionDate: rr.ReceiptDate,
                    ReceiptStatus: rr.ReceiptStatus,
                    AcceptanceDecision: rr.AcceptanceDecision,
                    Notes: rr.Remarks
                }
            )
        );
        ClearCollect(colApprovalLog, Filter(Procurement_ApprovalLog, RequestIDText = Text(gSelectedRequest.ID)));
        Set(gRoundsDone, Coalesce(gSelectedRequest.ReceiptRoundCount, 0));
        Set(gGRHasAttachments, CountRows(LookUp(Procurement_ExecutionLog, RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 3).Attachments) > 0);
        Set(gSFU1HasAttachments, CountRows(LookUp(Procurement_ExecutionLog, RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 4).Attachments) > 0);
        Set(gSFU2HasAttachments, CountRows(LookUp(Procurement_ExecutionLog, RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 5).Attachments) > 0);
        Set(gShowReceiptPhotos, false);
        Set(gShowLogDetail, false)
    Children:
      - rowHeader_RD:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblScreenTitle_3:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =60
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Max Biocare Procurement - Request Detail"
                  Width: =615
            - lblUserInfo_RDS:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =60
                  PaddingRight: =0
