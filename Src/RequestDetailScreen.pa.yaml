                                                      PaddingLeft: =8
                                                      PaddingRight: =8
                                                      PaddingTop: =2
                                                      RadiusBottomLeft: =4
                                                      RadiusBottomRight: =4
                                                      RadiusTopLeft: =4
                                                      RadiusTopRight: =4
                                                      Size: =9
                                                      Text: ="Details"
