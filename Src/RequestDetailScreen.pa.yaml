                                                    Properties:
                                                      Color: =If(IsBlank(ThisItem.PurchaseOrderLink), RGBA(136, 135, 128, 1), RGBA(56, 96, 178, 1))
                                                      Height: =24
                                                      OnSelect: =If(Not(IsBlank(ThisItem.PurchaseOrderLink)), Launch(ThisItem.PurchaseOrderLink, {}, LaunchTarget.New))
                                                      PaddingLeft: =0
                                                      Size: =10
                                                      Text: =If(IsBlank(ThisItem.PurchaseOrderLink), "—", "Open purchase order ↗")
                                                      Underline: =Not(IsBlank(ThisItem.PurchaseOrderLink))
                                                      Width: =Parent.Width * 0.2
                                                      Wrap: =false
                                                - btnExecLogDetail:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Align: =Align.Center
                                                      BasePaletteColor: =RGBA(83, 74, 183, 1)
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      OnSelect: |-
                                                        =ClearCollect(
                                                            colLogDetail,
                                                            {FieldLabel: "Step", FieldValue: Switch(ThisItem.StepNumber,
                                                                1, "Procurement Execution",
                                                                2, "Accounting Handover",
                                                                3, "Goods Receipt & Acceptance",
                                                                4, "Supplier Follow-up 1",
                                                                5, "Procurement Close-out",
                                                                6, "Invoice Submission",
                                                                ""
                                                            )},
                                                            {FieldLabel: "Executed by", FieldValue: Coalesce(ThisItem.ExecutedBy.Value, "")},
                                                            {FieldLabel: "Date", FieldValue: If(IsBlank(ThisItem.ExecutedAt), "", Text(ThisItem.ExecutedAt, "dd/mm/yyyy hh:mm"))},
                                                            {FieldLabel: "Supplier", FieldValue: Coalesce(ThisItem.SupplierSummary, "")},
                                                            {FieldLabel: "Purchase Order Link", FieldValue: Coalesce(ThisItem.PurchaseOrderLink, "")},
                                                            {FieldLabel: "Notes", FieldValue: Coalesce(ThisItem.Notes, "")}
                                                        );
                                                        RemoveIf(colLogDetail, IsBlank(FieldValue));
                                                        Set(gLogDetailTitle, Switch(ThisItem.StepNumber,
                                                            1, "Procurement Execution",
                                                            2, "Accounting Handover",
                                                            3, "Goods Receipt & Acceptance",
                                                            4, "Supplier Follow-up 1",
                                                            5, "Procurement Close-out",
                                                            6, "Invoice Submission",
                                                            "Execution Step " & ThisItem.StepNumber
                                                        ));
                                                        Set(gShowLogDetail, true)
