Screens:
  SupplierFollowUpScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSFU1LogEntry, Blank());
        Set(gSFU1PendingAttachments, Blank());
        NewForm(frmSFU1Log_SFU);
        Reset(chkSFU1);
        Reset(chkSFU2);
        Reset(chkSFU3);
        Reset(chkSFU4);
        Reset(chkSFU5);
        Reset(dpReceiptDate2_SFU);
        Reset(ddReceiptStatus2_SFU);
        Reset(ddAcceptanceDecision2_SFU);
        Reset(txtRemarks2_SFU);
        Reset(ddAssignReceiver_SFU);
        Set(gSelectedRequest, LookUp(Procurement_Requests, ID = gSelectedRequest.ID));
        Set(gRoundsDone, Coalesce(gSelectedRequest.ReceiptRoundCount, 0));
        Set(gLatestDecision, gSelectedRequest.LatestReceiptDecision);
        Set(gCurrentRound, gRoundsDone + 1);
        Set(gSFURoundOpen, gSelectedRequest.Status.Value = "Pending Supplier Follow-up" && gLatestDecision = "Requires Supplier Follow-up" && gRoundsDone < 2);
        ClearCollect(colReceiptRounds, Filter('Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(
            colRoundHistory,
            ForAll(
                Sort(
                    Filter('Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)),
                    RoundNumber,
                    SortOrder.Ascending
                ) As rr,
                {
                    ID: rr.ID,
                    StepNumber: 3,
                    StepLabel: "Goods receipt",
                    RoundNumber: rr.RoundNumber,
                    ActorName: rr.ReceivedBy,
                    ActionDate: rr.ReceiptDate,
                    ReceiptStatus: rr.ReceiptStatus,
                    AcceptanceDecision: rr.AcceptanceDecision,
                    Notes: rr.Remarks
                }
            )
        );
        Set(gSFU1DelegationMode, If(IsBlank(gSelectedRequest.SFU1AssignedToID) || gSelectedRequest.SFU1AssignedToID.Id = 0 || gSelectedRequest.SFU1AssignedToID.Id = gCurrentEmployee.ID, "I will receive", "Assign to someone else"));
        Set(gShowReceiptPhotos, false);
        Set(locCreditNoteURL_SFU, "");
        Set(gPendingCreditNoteName_SFU, "")
    Children:
      - rectHeader_SFU:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_SFU:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Max Biocare Procurement - Supplier Follow-up"
            Width: =600
            X: =20
      - rowInfoBlock_SFU:
