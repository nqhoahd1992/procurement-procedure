                      Properties:
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =120
                        X: =40
                        Y: =40
                  - btnSaveAssignment_SFU:
                      Control: Button@0.0.45
                      Properties:
                        Height: =44
                        OnSelect: |-
                          =If(
                            IsBlank(ddAssignReceiver_SFU.Selected.Title),
                            Notify("Please select a person to assign", NotificationType.Error),
                            If(
                              Not(IsBlank(gSelectedRequest.SFU1AssignedToID)) &&
                              gSelectedRequest.SFU1AssignedToID.Id <> ddAssignReceiver_SFU.Selected.ID,
                              ProcurementNotify.Run(
                                  LookUp('Employee List', ID = gSelectedRequest.SFU1AssignedToID.Id).Email,
                                  gSelectedRequest.SFU1AssignedToID.Value,
                                  gSelectedRequest.Title,
                                  gSelectedRequest.ID,
                                  "Unassigned",
                                  Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy"),
                                  gSelectedRequest.Category.Value,
                                  "Max Biocare Procurement",
                                  gSelectedRequest.ID
                              )
                            );
                            With(
                              {wPatched: Patch(Procurement_Requests, LookUp(Procurement_Requests, ID = gSelectedRequest.ID), {SFU1AssignedToID: {Id: ddAssignReceiver_SFU.Selected.ID, Value: ddAssignReceiver_SFU.Selected.Title}})},
                              If(
                                IsBlank(wPatched.ID),
                                Notify("Failed to save assignment. Please try again.", NotificationType.Error),
                                Set(gSelectedRequest, wPatched);
                                ProcurementNotify.Run(
                                  ddAssignReceiver_SFU.Selected.Email,
                                  ddAssignReceiver_SFU.Selected.Title,
                                  gSelectedRequest.Title,
                                  gSelectedRequest.ID,
                                  "SupplierFollowUp",
                                  Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy"),
                                  gSelectedRequest.Category.Value,
                                  "Max Biocare Procurement",
                                  gSelectedRequest.ID
                                );
                                Notify("Assignment saved to " & ddAssignReceiver_SFU.Selected.Title, NotificationType.Success)
                              )
                            )
                          )
                        Text: ="Save Assignment"
                        Visible: =gSFU1DelegationMode = "Assign to someone else"
                        Width: =160
                        X: =40
                        Y: =40
                  - btnSubmitStep1_SFU:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =With(
                              {wLatest: LookUp(Procurement_Requests, ID = gSelectedRequest.ID)},
                              If(
                                  Not(
                                      wLatest.RequesterEmail = gCurrentEmployee.Email && IsBlank(wLatest.SFU1AssignedToID)
                                      || Not(IsBlank(wLatest.SFU1AssignedToID)) && wLatest.SFU1AssignedToID.Id = gCurrentEmployee.ID
                                  ),
                                  Notify("This assignment has been reassigned to someone else. Your submission has been cancelled.", NotificationType.Warning);
                                  Navigate(HomeScreen),
                                  If(
                                      Coalesce(wLatest.ReceiptRoundCount, gRoundsDone) <> gRoundsDone,
                                      Notify("Another receipt round has already been recorded for this request. Your submission has been cancelled.", NotificationType.Warning);
                                      Navigate(HomeScreen),
                                      If(
                                          Not(chkSFU1.Checked && chkSFU2.Checked && chkSFU3.Checked && chkSFU4.Checked && chkSFU5.Checked),
                                          Notify("Please complete all checklist items", NotificationType.Error),
                                          If(
                                              IsBlank(dpReceiptDate2_SFU.SelectedDate) ||
                                              IsBlank(ddReceiptStatus2_SFU.Selected.Value) ||
                                              IsBlank(ddAcceptanceDecision2_SFU.Selected) ||
                                              IsBlank(txtRemarks2_SFU.Value) ||
                                              CountRows(attSFU1Photos.Attachments) = 0,
                                              Notify("Please fill in all required fields", NotificationType.Error),
                                              With(
                                                  {
                                                      wPatched: Patch(
                                                          Procurement_Requests,
                                                          gSelectedRequest,
                                                          {
                                                              Status: {Value: If(
                                                                  ddAcceptanceDecision2_SFU.Selected.Value = "Accepted",
                                                                  If(!wLatest.InvoiceSubmitted, "Pending Invoice", "Pending Accounting"),
                                                                  "Pending Supplier Follow-up"
                                                              )},
                                                              ReceiptRoundCount: gCurrentRound,
                                                              LatestReceiptDecision: ddAcceptanceDecision2_SFU.Selected.Value,
                                                              SFU1AssignedToID: Blank()
                                                          }
                                                      )
                                                  },
                                                  If(
                                                      IsBlank(wPatched.ID),
                                                      Notify("Failed to submit. Please try again.", NotificationType.Error),
                                                      If(
                                                          ddAcceptanceDecision2_SFU.Selected.Value = "Accepted",
                                                          Patch(Procurement_Requests, {ID: gSelectedRequest.ID}, {Fulfillment: {Value: "Fulfilled"}})
                                                      );
                                                      With(
                                                          {wRound: Patch(
                                                              'Procurement Receipt Rounds',
                                                              Defaults('Procurement Receipt Rounds'),
                                                              {
                                                                  Title: "R" & gCurrentRound & " - " & gSelectedRequest.Title,
                                                                  RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                                  RequestIDText: Text(gSelectedRequest.ID),
                                                                  RoundNumber: gCurrentRound,
                                                                  ReceivedBy: gCurrentEmployee.Title,
                                                                  ReceiptDate: dpReceiptDate2_SFU.SelectedDate,
                                                                  ReceiptStatus: ddReceiptStatus2_SFU.Selected.Value,
                                                                  AcceptanceDecision: ddAcceptanceDecision2_SFU.Selected.Value,
                                                                  Remarks: txtRemarks2_SFU.Value
                                                              }
                                                          )},
                                                          If(
                                                              IsBlank(wRound.ID),
                                                              Notify("Failed to save the receipt round. Please try again.", NotificationType.Error),
                                                              Set(gSFU1PendingAttachments, attSFU1Photos.Attachments);
                                                              Set(gSFU1LogEntry, wRound);
                                                              EditForm(frmSFU1Log_SFU);
                                                              SubmitForm(frmSFU1Log_SFU);
                                                              Patch(
                                                                  Procurement_ExecutionLog,
                                                                  Defaults(Procurement_ExecutionLog),
                                                                  {
                                                                      Title: "Step 4 - Goods Receipt Round " & gCurrentRound & " - " & gSelectedRequest.Title,
                                                                      RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                                      RequestIDText: Text(gSelectedRequest.ID),
                                                                      StepNumber: 4,
                                                                      StepName: {Value: "Supplier Follow-up — Requester Detail"},
                                                                      ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                      ExecutedAt: Now(),
                                                                      Notes: txtRemarks2_SFU.Value
                                                                  }
                                                              );
                                                              Notify(
                                                                  "Round " & gCurrentRound & " receipt submitted. " &
                                                                  Switch(
                                                                      ddAcceptanceDecision2_SFU.Selected.Value,
                                                                      "Accepted", "Request is now " & If(!wLatest.InvoiceSubmitted, "Pending Invoice.", "Pending Accounting."),
                                                                      "Accepted with Adjustment", "Procurement will now upload the Credit Note."
                                                                  ),
                                                                  NotificationType.Success
                                                              );
                                                              Refresh(Procurement_Requests);
                                                              Navigate(HomeScreen)
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Submit →"
                        Visible: |-
                          =gSFURoundOpen
                          && gSFU1DelegationMode = "I will receive"
                        Width: =160
                        X: =40
                        Y: =40
