Screens:
  AccountingScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(chk1_AC);
        Reset(chk2_AC);
        Reset(chk3_AC);
        Reset(chk4_AC);
        Reset(chk5_AC);
        Reset(txtNotes_AC)
