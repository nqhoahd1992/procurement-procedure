                        OnSelect: |-
                          =With(
                              {wPatched: Patch(Procurement_Requests, gSelectedRequest, {RequesterInvoiceURL: ""})},
                              If(
                                  IsBlank(wPatched.ID),
                                  Notify("Failed to remove. Please try again.", NotificationType.Error),
                                  Set(gSelectedRequest, LookUp(Procurement_Requests, ID = gSelectedRequest.ID));
                                  Notify("Invoice removed.", NotificationType.Success)
                              )
                          )
